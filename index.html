<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon_issa.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light dark" />
  <!-- iOS: launch "Add to Home Screen" as a real standalone app (iOS ignores
       the web manifest for this). -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Issa Beauty" />
  <title>Issa Beauty Dashboard</title>
  <script>
    // Apply the theme before first paint so the status bar / browser chrome
    // match the app on load (and mobile browsers like Samsung Internet don't
    // force their own dark chrome). Values must match src/lib/theme.ts.
    (function () {
      try {
        var s = localStorage.getItem("theme");
        var dark =
          s === "dark" ||
          (s !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#020817" : "#ffffff");
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root" class="bg-background min-h-[100vh]" data-vaul-drawer-wrapper></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
